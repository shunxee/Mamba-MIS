[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba-mis"
version = "0.1.0"
description = "Visual state space models with fusion bridges and spectral gates for medical image segmentation"
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.8.0", "torchvision==0.23.0", "timm==1.0.19", "einops==0.8.1",
                "numpy==2.2.6", "Pillow==11.3.0", "PyYAML==6.0.2", "matplotlib==3.10.5"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]
cuda = ["triton==3.4.0; platform_system == 'Linux'", "mamba-ssm==2.2.5; platform_system == 'Linux'",
        "causal-conv1d==1.5.2; platform_system == 'Linux'"]

[project.scripts]
mis = "mamba_mis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mamba_mis = ["models/vendor/*/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: requires Linux CUDA and Triton", "slow: full-resolution or large-model checks"]
